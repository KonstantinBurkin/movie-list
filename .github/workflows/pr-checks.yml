name: PR Checks

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

# Required permissions for commenting on PRs
permissions:
  contents: read
  pull-requests: write
  issues: write

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: pipx install poetry

    - name: Cache Poetry virtualenv
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry/virtualenvs
        key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: poetry install --extras dev --no-interaction --no-root

    - name: Check import sorting with isort
      id: isort
      run: |
        poetry run isort scripts --check-only --diff
      continue-on-error: false

    - name: Lint with flake8 (strict)
      id: lint
      run: |
        # Stop on syntax errors or undefined names
        poetry run flake8 scripts --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check for code quality issues
        poetry run flake8 scripts --count --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: false

    - name: Run unit tests
      id: test
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      run: |
        poetry run pytest tests/ -v --cov=scripts --cov-report=term-missing --cov-report=xml --cov-fail-under=65
      continue-on-error: false

    - name: Check for data file
      run: |
        if [ ! -f "data/movies_df.parquet" ]; then
          echo "⚠️  Warning: movies_df.parquet not found - recommendation system requires this file"
          echo "This is not blocking, but functionality will be limited without it."
        else
          echo "✅ Data file found"
        fi

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: pipx install poetry

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    - name: Verify imports
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: poetry run python tests/verify_imports.py

    - name: Check for known security vulnerabilities
      run: |
        poetry run pip install safety
        poetry run safety check --json || echo "⚠️  Some vulnerabilities found, review required"

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check PR size
      run: |
        # Fetch main branch for comparison
        git fetch origin main:main || git fetch origin main

        # Count changed lines
        ADDED=$(git diff --numstat origin/main...HEAD 2>/dev/null | awk '{s+=$1} END {print s+0}')
        REMOVED=$(git diff --numstat origin/main...HEAD 2>/dev/null | awk '{s+=$2} END {print s+0}')
        TOTAL=$((ADDED + REMOVED))

        echo "Lines added: $ADDED"
        echo "Lines removed: $REMOVED"
        echo "Total changes: $TOTAL"

        if [ "$TOTAL" -gt 1000 ]; then
          echo "⚠️  Warning: Large PR detected ($TOTAL lines changed)"
          echo "Consider breaking this into smaller PRs for easier review"
        else
          echo "✅ PR size is reasonable"
        fi
